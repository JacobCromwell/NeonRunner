html/head_include="<!-- DESIGN-TBD (docs/questions/e2.md, docs/questions/l1.md): the web demo on a phone. The game is laid out for landscape (GDD §2), so a phone held upright is asked to turn sideways, and a phone whose frame doesn't fit its screen (itch.io's embed of a fixed size, which the host page shrinks to the screen's width) is offered the game full screen. Either way the page covers the game and calls window.neonPage.onCover(), which the game sets (WebPage.watch_cover, App), so a running level pauses. window.neonPage: insets() is env(safe-area-inset-*) in CSS pixels (WebPage, for UiTheme.safe_area_margins), mode() is the cover now ('turn', 'fit' or ''). tools/web/browser_check.js (phone, itch_embed) and test_web_demo keep it in place. -->
<style>
html.neon-turn body::after {
	content: 'Turn your phone sideways to play';
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	padding: calc(var(--neon-u, 1) * 32px);
	text-align: center;
	text-transform: uppercase;
	letter-spacing: 0.06em;
	font: 600 calc(var(--neon-u, 1) * 22px) / 1.5 system-ui, sans-serif;
	color: #ebf2ff;
	background: linear-gradient(#090a1c, #020206);
}
#neon-fit {
	display: none;
	position: fixed;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	z-index: 10;
	font: 600 calc(var(--neon-u, 1) * 16px) / 1.4 system-ui, sans-serif;
	color: #ebf2ff;
	background: linear-gradient(#090a1c, #020206);
}
html.neon-fit-on #neon-fit {
	display: block;
}
#neon-fit .neon-card {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: calc(var(--neon-u, 1) * 12px);
	box-sizing: border-box;
	height: min(100%, var(--neon-box, 100%));
	padding: calc(var(--neon-u, 1) * 20px);
	text-align: center;
}
#neon-fit p {
	margin: 0;
}
#neon-fit .neon-title {
	font-size: calc(var(--neon-u, 1) * 22px);
	text-transform: uppercase;
	letter-spacing: 0.06em;
}
#neon-fit .neon-note {
	font-weight: 500;
	color: #9db0d6;
}
html.neon-compact #neon-fit .neon-note {
	display: none;
}
#neon-fit a {
	display: block;
	box-sizing: border-box;
	min-width: calc(var(--neon-u, 1) * 240px);
	padding: calc(var(--neon-u, 1) * 14px) calc(var(--neon-u, 1) * 24px);
	border: calc(var(--neon-u, 1) * 2px) solid #389eff;
	background: #12335f;
	color: #ebf2ff;
	font-size: calc(var(--neon-u, 1) * 18px);
	letter-spacing: 0.06em;
	text-transform: uppercase;
	text-decoration: none;
}
#neon-fit button {
	font: inherit;
	font-weight: 500;
	color: #9db0d6;
	background: none;
	border: 0;
	padding: calc(var(--neon-u, 1) * 10px);
	text-decoration: underline;
}
</style>
<script>
(function () {
	var root = document.documentElement;
	// 'Play here anyway': null until it is pressed, then whether the phone was held upright then. It holds
	// until the frame fits the screen, and until the phone is turned (an upright phone gets its prompt again).
	var stayed = null;
	var covered = false;
	// A turn changes the page's size a moment after the orientation, so a 'fit' card (or a change of its
	// wording) waits for two measurements half a second apart to agree (the key is the answer, its size and
	// the way the phone is held); 'turn' and nothing apply at once.
	var pendingKey = '';
	var pendingAt = 0;
	var shownKey = '';
	var mode = '';
	var fit = null;
	var probe = null;

	function coarse() {
		try {
			return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
		} catch (e) {
			return false;
		}
	}

	// Held upright? iOS gives screen.width and screen.height as for an upright phone whichever way it is
	// held, so this asks screen.orientation (Safari 16.4), then window.orientation (older iOS), then the page's shape.
	function upright(w, h) {
		try {
			if (window.screen.orientation && typeof window.screen.orientation.type === 'string') {
				return window.screen.orientation.type.indexOf('portrait') === 0;
			}
		} catch (e) {
			// Fall through to the next best answer.
		}
		if (typeof window.orientation === 'number') {
			return window.orientation % 180 === 0;
		}
		return h > w;
	}

	// Which cover the page needs now: 'turn' (the page itself is taller than wide: the game is landscape),
	// 'fit' (a phone's frame that is not about the screen's size: a fixed embed the host page shrinks, a small
	// one, one taller than the screen, or any frame of a phone the browser says is held upright, which the
	// frame's own shape can't show) or ''. A page that is not framed goes by its own shape alone. unit is how
	// many of the page's CSS pixels a screen point is, so a cover's text keeps its size on the glass.
	function measure() {
		var w = window.innerWidth;
		var h = window.innerHeight;
		var wide = Math.max(window.screen.width, window.screen.height);
		var narrow = Math.min(window.screen.width, window.screen.height);
		var phone = coarse() && narrow > 0 && narrow <= 520;
		var framed = false;
		try {
			framed = window.top !== window.self;
		} catch (e) {
			framed = true;
		}
		var next = '';
		var up = false;
		var seen = w;
		if (phone && !framed) {
			next = h > w ? 'turn' : '';
			seen = h > w ? narrow : wide;
		} else if (phone) {
			up = upright(w, h);
			seen = up ? narrow : wide;
			if (h > w && up) {
				next = 'turn';
			} else {
				var bad = up || w > wide * 1.03 || w < wide * 0.8 || h > narrow * 1.03;
				if (!bad) {
					stayed = null;
				} else if (stayed !== up) {
					next = 'fit';
				}
			}
		} else if (coarse() && h > w) {
			next = 'turn';
		}
		// A frame taller than the screen shows only its top: the card keeps to what a phone's page can show of it
		// (about four fifths of the screen's short side), in the frame's pixels.
		var unit = Math.max(1, w / Math.max(seen, 1));
		return { mode: next, up: up, unit: unit, box: Math.round(Math.min(h, narrow * 0.8 * unit)), h: h, key: up + ':' + w + 'x' + h };
	}

	function build() {
		if (fit || !document.body) {
			return;
		}
		fit = document.createElement('div');
		fit.id = 'neon-fit';
		var card = document.createElement('div');
		card.className = 'neon-card';
		var title = document.createElement('p');
		title.className = 'neon-title';
		title.textContent = 'Play it full screen';
		var note = document.createElement('p');
		note.className = 'neon-note';
		note.textContent = 'The menus are easier to read when the game has the whole screen.';
		var link = document.createElement('a');
		link.href = window.location.href.split('#')[0];
		link.target = '_blank';
		link.rel = 'noopener';
		link.textContent = 'Open full screen';
		link.addEventListener('click', function (e) {
			var el = document.documentElement;
			var request = el.requestFullscreen || el.webkitRequestFullscreen;
			if (!request || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
				return; // An iPhone has no fullscreen for a page: the link opens the game in a tab of its own.
			}
			e.preventDefault();
			try {
				var done = request.call(el);
				if (done && done.catch) {
					done.catch(function () {
						window.open(link.href, '_blank');
					});
				}
			} catch (err) {
				window.open(link.href, '_blank');
			}
		});
		var stay = document.createElement('button');
		stay.type = 'button';
		stay.textContent = 'Play here anyway';
		stay.addEventListener('click', function () {
			// Whether the phone is upright now, not when the card was last drawn (a turn may be under way).
			try {
				stayed = measure().up;
			} catch (e) {
				stayed = false;
			}
			apply();
		});
		card.appendChild(title);
		card.appendChild(note);
		card.appendChild(link);
		card.appendChild(stay);
		fit.appendChild(card);
		document.body.appendChild(fit);
	}

	function apply() {
		var m;
		try {
			m = measure();
		} catch (e) {
			return;
		}
		if (m.mode === 'fit' && m.key !== shownKey) {
			var now = Date.now();
			if (pendingKey !== m.key) {
				pendingKey = m.key;
				pendingAt = now;
				window.setTimeout(apply, 500);
				return;
			}
			if (now - pendingAt < 400) {
				return;
			}
			shownKey = m.key;
		} else if (m.mode !== 'fit') {
			pendingKey = '';
			shownKey = '';
		}
		mode = m.mode;
		root.style.setProperty('--neon-u', String(m.unit));
		root.classList.toggle('neon-turn', mode === 'turn');
		root.classList.toggle('neon-fit-on', mode === 'fit');
		root.style.setProperty('--neon-box', m.box + 'px');
		root.classList.toggle('neon-compact', m.box / m.unit < 300);
		if (mode === 'fit') {
			build();
			if (fit) {
				var texts = fit.firstChild.childNodes;
				texts[0].textContent = m.up ? 'Turn your phone sideways' : 'Play it full screen';
				texts[1].textContent = m.up ? 'Then play here, or open the game full screen.' : 'The menus are easier to read when the game has the whole screen.';
			}
		}
		var isCovered = mode !== '';
		if (isCovered && !covered && typeof window.neonPage.onCover === 'function') {
			// The game is hidden: a running level pauses, as it does for a phone call.
			try {
				window.neonPage.onCover(mode);
			} catch (e) {
				// The game is not listening (yet).
			}
		}
		covered = isCovered;
	}

	window.neonPage = {
		// The browser's safe-area insets in the game's own frame, 'left,top,right,bottom' in CSS pixels.
		insets: function () {
			if (!probe && document.body) {
				probe = document.createElement('div');
				probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
					+ 'padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)';
				document.body.appendChild(probe);
			}
			if (!probe) {
				return '';
			}
			var style = window.getComputedStyle(probe);
			return [style.paddingLeft, style.paddingTop, style.paddingRight, style.paddingBottom].map(function (v) {
				return parseFloat(v) || 0;
			}).join(',');
		},
		mode: function () {
			return mode;
		}
	};

	['resize', 'orientationchange'].forEach(function (name) {
		window.addEventListener(name, apply);
	});
	try {
		window.screen.orientation.addEventListener('change', apply);
	} catch (e) {
		// No screen.orientation events: the timer below notices a turn.
	}
	document.addEventListener('DOMContentLoaded', apply);
	// Some browsers report a turn late, or only to the page that is not framed.
	window.setInterval(apply, 500);
	apply();
}());
</script>
<!-- DESIGN-TBD (docs/OPEN_QUESTIONS_DEFERRED.md item 827): sound on an iPhone with its ring/silent switch on. Safari keeps Web Audio (all of the game's sound, music and effects) silent then, unlike a video, unless the page says its audio is 'playback' (the Audio Session API: a browser without it has no navigator.audioSession and skips this). Set at once, and again on the first touch, click or key and when the page comes back to the front, in case the browser sets it back. The game plays through the switch, as a video does; whether it should is the owner's to say. tools/web/browser_check.js (audio_session) and test_web_demo keep it in place. -->
<script>
(function () {
	function playback() {
		try {
			if ('audioSession' in navigator && navigator.audioSession && navigator.audioSession.type !== 'playback') {
				navigator.audioSession.type = 'playback';
			}
		} catch (e) {
			// A browser that refuses: the sound stays as the browser has it.
		}
	}
	playback();
	['touchend', 'pointerup', 'click', 'keydown'].forEach(function (name) {
		window.addEventListener(name, playback, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', playback);
}());
</script>"
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
